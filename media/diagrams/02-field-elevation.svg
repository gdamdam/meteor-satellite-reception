<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">Field elevation of the tripod dipole</title><desc id="d">A low-key field drawing showing the V dipole held level above a camera tripod, coax dropping to the RSPdx R2 roughly 30 to 40 centimetres below, then USB to a computer.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4 0 8Z" fill="#a65038"/></marker></defs>
<rect width="1200" height="800" fill="#f3eddf"/><path d="M0 605H1200" stroke="#b3ad9d" stroke-width="3"/><text x="72" y="95" font-family="Georgia,serif" font-size="44" fill="#382f2b">On the camera tripod</text><text x="74" y="128" font-family="Arial,sans-serif" font-size="17" letter-spacing="2" fill="#9d553e">FIELD ELEVATION / SETUP</text>
<path d="M194 278 L912 278" fill="none" stroke="#282c2b" stroke-width="13" stroke-linecap="round"/><circle cx="553" cy="278" r="18" fill="#ab603f"/><path d="M548 298 C548 353 595 356 595 418" fill="none" stroke="#51473d" stroke-width="5"/>
<path d="M553 296 L553 371" stroke="#28302e" stroke-width="16"/><path d="M507 371 L599 371 L585 401 L520 401Z" fill="#3c4440"/><path d="M551 398 L343 637 M552 398 L757 637 M552 398 L552 637" stroke="#404945" stroke-width="10" stroke-linecap="round"/><path d="M386 589 L713 589" stroke="#74746a" stroke-width="4"/>
<rect x="550" y="408" width="112" height="73" rx="11" fill="#d9d1bd" stroke="#4f5d55" stroke-width="3"/><text x="567" y="440" font-family="Arial,sans-serif" font-size="17" fill="#32443e">RSPdx</text><text x="584" y="462" font-family="Arial,sans-serif" font-size="16" fill="#32443e">R2</text>
<line x1="704" y1="281" x2="704" y2="408" stroke="#a65038" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="722" y="341" font-family="Arial,sans-serif" font-size="20" fill="#8c422d">approx. 30 to 40 cm</text><text x="722" y="366" font-family="Arial,sans-serif" font-size="17" fill="#665c4f">short, thin coax</text>
<path d="M663 445 C780 438 859 493 900 526" fill="none" stroke="#526983" stroke-width="5"/><rect x="889" y="501" width="176" height="111" rx="8" fill="#f9f7ee" stroke="#526983" stroke-width="4"/><path d="M872 618 H1082" stroke="#526983" stroke-width="6"/><text x="922" y="550" font-family="Arial,sans-serif" font-size="22" fill="#314a60">Laptop</text><text x="776" y="481" font-family="Arial,sans-serif" font-size="20" fill="#41607a">USB</text>
<path d="M190 187 H915" stroke="#8c9589" stroke-width="2" stroke-dasharray="10 9"/><text x="915" y="194" font-family="Arial,sans-serif" font-size="18" fill="#5e6b61">Horizontal plane</text>
<text x="72" y="711" font-family="Arial,sans-serif" font-size="21" fill="#4e5149">Both 53.4 cm arms lie in the same level plane; their 120° spread is seen from above.</text>
</svg>